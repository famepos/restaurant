<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FamePOS</title>
  
  <!-- โหลด Library ที่จำเป็น -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #fccfed; color: #b32089; margin: 0; }
    /* ซ่อน Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full h-screen flex overflow-hidden text-gray-800 bg-gray-100">

  <!-- ======================================================= -->
  <!-- 🔐 1. หน้าจอล็อกอิน (จะแสดงทับหน้าจอทั้งหมดตอนเปิดเว็บ) -->
  <!-- ======================================================= -->
  <div id="loginOverlay" class="fixed inset-0 bg-pink-50 z-[9999] flex items-center justify-center p-4">
      <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm flex flex-col items-center">
          <img src="https://i.postimg.cc/7h052Ffb/daa42c0e-2ccf-455e-9d46-491a67539e44.png" class="w-24 h-24 object-contain mb-4">
          <h2 class="text-3xl font-black text-pink-700 mb-1">FamePOS</h2>
          <p class="text-gray-500 text-sm mb-8 font-bold">ระบบจัดการร้านค้า ยินดีให้บริการ</p>

          <div class="w-full space-y-4">
              <div>
                  <label class="block text-sm font-bold text-gray-700 mb-1">ชื่อพนักงาน หรือ เบอร์โทรศัพท์</label>
                  <input type="text" id="loginUser" class="w-full p-4 bg-gray-50 border-2 border-pink-100 rounded-xl focus:border-pink-500 outline-none font-bold text-center text-lg" placeholder="ระบุเบอร์โทรศัพท์">
              </div>
              <div>
                  <label class="block text-sm font-bold text-gray-700 mb-1">รหัสผ่าน (PIN)</label>
                  <input type="password" id="loginPin" class="w-full p-4 bg-gray-50 border-2 border-pink-100 rounded-xl focus:border-pink-500 outline-none font-bold text-center text-2xl tracking-[0.5em]" placeholder="••••">
              </div>
              
              <button onclick="processLogin()" class="w-full bg-pink-600 text-white font-bold py-4 rounded-xl text-lg hover:bg-pink-700 shadow-md transition mt-4">
                  🔑 เข้าสู่ระบบร้านค้า
              </button>
          </div>
      </div>
  </div>

  <!-- ======================================================= -->
  <!-- 🏠 2. โครงสร้างหลักของแอป (เมนู Sidebar & หน้าจอต่างๆ) -->
  <!-- ======================================================= -->
  <!-- ⚠️ นำโค้ด HTML เมนู Sidebar และหน้าจอ SalesView ของคุณมาวางต่อตรงนี้ได้เลย ⚠️ -->
  
  <div class="flex-1 flex flex-col items-center justify-center w-full h-full bg-white relative">
      <div class="text-center">
         <span class="text-6xl mb-4 block">✨</span>
         <h1 class="text-3xl font-bold text-pink-300">เข้าสู่ระบบสำเร็จ!</h1>
         <p class="text-gray-400 mt-2 font-bold">พื้นที่นี้คือส่วนของหน้าแอปพลิเคชันหลัก</p>
      </div>
  </div>

  <!-- ======================================================= -->
  <!-- ⚙️ 3. ระบบ JavaScript หลัก -->
  <!-- ======================================================= -->
  <script>
    // 🔗 ลิงก์ API หลังบ้านของคุณ
    const API_URL = "https://script.google.com/macros/s/AKfycbwHmG_j6fmCAo9AsqWWhwLZ7mGHOeUn7fUAbcZ8a8REopMo0jGoIo_ymhzcSP0eqA_UXg/exec";

    // 🪄 Magic Proxy (แก้ไขให้ส่ง storeId อัตโนมัติแล้ว)
    const google = {
        script: {
            get run() {
                let successCb = null;
                let failureCb = null;
                const proxy = new Proxy({}, {
                    get: function(target, prop) {
                        if (prop === 'withSuccessHandler') return function(cb) { successCb = cb; return proxy; };
                        if (prop === 'withFailureHandler') return function(cb) { failureCb = cb; return proxy; };
                        
                        return function(...args) {
                            // 🌟 ดึงรหัสร้านค้าจากเครื่อง (LocalStorage)
                            let activeStoreId = localStorage.getItem('CURRENT_STORE_ID') || "";
                            
                            fetch(API_URL, {
                                method: "POST",
                                headers: { "Content-Type": "text/plain;charset=utf-8" },
                                // 🌟 ส่งข้อมูลพร้อม storeId
                                body: JSON.stringify({ action: prop, args: args, storeId: activeStoreId }),
                                redirect: "follow"
                            })
                            .then(res => res.json())
                            .then(data => {
                                if(data.status === "Success" && successCb) successCb(data.result);
                                else if (data.status !== "Success" && failureCb) failureCb(data.message);
                            })
                            .catch(err => {
                                if(failureCb) failureCb(err);
                                else console.error("Fetch Error:", err);
                            });
                        };
                    }
                });
                return proxy;
            }
        }
    };

    // 🔑 ฟังก์ชันล็อกอิน (แก้ Syntax Error แล้ว)
    function processLogin() {
        let userField = document.getElementById('loginUser'); 
        let passField = document.getElementById('loginPin');
        if (!userField || !passField) return;

        let user = userField.value.trim();
        let pass = passField.value.trim();

        if (user === "" || pass === "") {
            Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกข้อมูลให้ครบถ้วน' });
            return; 
        }

        Swal.fire({ title: 'กำลังตรวจสอบข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

        google.script.run
            .withSuccessHandler(function(res) {
                if (res.status === "Success") {
                    
                    // 🌟 1. บันทึก Store ID ลงเครื่อง เพื่อให้ Magic Proxy หยิบไปใช้
                    localStorage.setItem('CURRENT_STORE_ID', res.storeId);
                    window.currentUser = res.name;
                    window.currentBranch = res.branch;

                    Swal.fire({ icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', timer: 1500, showConfirmButton: false });
                    
                    // 🌟 2. ซ่อนหน้ากากล็อกอิน เพื่อเข้าสู่แอปหลัก
                    document.getElementById('loginOverlay').classList.add('hidden');
                    
                    // 🌟 3. โหลดฟังก์ชันอื่นๆ เช่น ดึงรายการสินค้าขึ้นมา
                    // loadProducts(); 
                    
                } else {
                    Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: res.message });
                }
            })
            .withFailureHandler(function(err) {
                Swal.fire({ icon: 'error', title: 'การเชื่อมต่อขัดข้อง', text: err.toString() });
            })
            .checkLogin(user, pass);
    }
    
    // ⚠️ นำฟังก์ชัน JavaScript เดิมของคุณทั้งหมด (เช่น loadProducts, addToCart ฯลฯ) มาวางต่อจากตรงนี้ได้เลย ⚠️
  </script>
</body>
</html>
